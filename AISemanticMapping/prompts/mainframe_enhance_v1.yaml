prompt_id: mainframe_enhance_v1
version: "v1"
description: "Generates COBOL enhancement suggestions including IF/EVALUATE blocks, validation sections, reusable routines, naming improvements, and optimisation suggestions."
created_date: "2026-05-29"
author: "mainframe-development-ai-agent"

system_prompt: |
  You are a senior COBOL developer specialising in mainframe application enhancement
  for banking and financial services.
  Your task is to generate COBOL enhancement suggestions and code snippets that improve
  the generated skeleton.
  IMPORTANT: Do NOT overwrite or replace the original skeleton.
  Generate enhancement suggestions as separate, additive code snippets.
  For optimisation requests, focus on: replacing nested IFs with EVALUATE,
  extracting reusable routines, improving structure and readability, and performance.
  Always respond with valid JSON only. No markdown, no commentary outside JSON.

user_prompt_template: |
  Generate COBOL enhancement suggestions for the following skeleton.

  JOB ID: {job_id}
  ENHANCEMENT FOCUS: {prompt_type}

  COBOL SKELETON:
  {cobol_content}

  COPYBOOK:
  {copybook_content}

  VALUE MAPPINGS:
  {value_mappings}

  TRANSFORMATION RULES:
  {transformation_rules}

  FIELD MAPPINGS:
  {field_mappings}

  RETRIEVED MAINFRAME PATTERNS:
  {rag_context}

  Generate targeted enhancement code snippets.

  Respond with this exact JSON structure:
  {{
    "businessExplanation": "<summary of enhancement approach>",
    "generatedCode": "<complete enhancement code snippets — COBOL only, well-commented>",
    "recommendations": [
      {{
        "category": "<validation|logic|performance|naming|structure>",
        "severity": "<HIGH|MEDIUM|LOW|INFO>",
        "message": "<description of the enhancement opportunity>",
        "suggestion": "<how to apply the enhancement>",
        "codeExample": "<specific COBOL snippet demonstrating the enhancement>"
      }}
    ],
    "warnings": [],
    "confidence": <float 0.0-1.0>,
    "reasoning": "<brief explanation>"
  }}

  Enhancement areas to cover:
  1. Value mapping IF → EVALUATE conversion for each coded field
  2. Reusable validation routines (PERFORM 1000-VALIDATE-RECORD)
  3. Reusable error handling routine (PERFORM 9999-ERROR-ROUTINE)
  4. Date validation paragraph
  5. Numeric field validation paragraph
  6. Modular paragraph structure improvements
  7. WORKING-STORAGE additions for error counters and flags
  8. Performance: use of 88-level condition names

  For each EVALUATE block, show both the original IF structure and the improved EVALUATE.
  All generated code MUST include header:
  *----------------------------------------------------------------*
  * AI GENERATED ENHANCEMENT — DEVELOPER REVIEW REQUIRED           *
  * NOT PRODUCTION READY                                            *
  *----------------------------------------------------------------*

response_schema:
  type: object
  required:
    - generatedCode
    - confidence
  properties:
    generatedCode:
      type: string
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
