prompt_id: mainframe_documentation_v1
version: "v1"
description: "Generates a structured developer guide covering business overview, field mapping summary, transformation summary, value mapping summary, copybook explanation, COBOL guidance, JCL guidance, and implementation notes."
created_date: "2026-05-29"
author: "mainframe-development-ai-agent"

system_prompt: |
  You are a senior technical writer and COBOL developer with 20+ years of experience
  in banking mainframe systems documentation.
  Your task is to generate a comprehensive developer guide for a mainframe batch program
  based on the provided artifacts.
  The documentation should be suitable for a mainframe developer who will implement,
  test, and deploy this program.
  Always respond with valid JSON only. No markdown, no commentary outside JSON.

user_prompt_template: |
  Generate a comprehensive developer guide for the following mainframe program.

  JOB ID: {job_id}

  COBOL SKELETON:
  {cobol_content}

  JCL SKELETON:
  {jcl_content}

  COPYBOOK:
  {copybook_content}

  FIELD MAPPINGS:
  {field_mappings}

  VALUE MAPPINGS:
  {value_mappings}

  TRANSFORMATION RULES:
  {transformation_rules}

  RETRIEVED MAINFRAME PATTERNS:
  {rag_context}

  Generate a structured developer guide.

  Respond with this exact JSON structure:
  {{
    "businessExplanation": "<complete multi-section developer guide as plain text>",
    "generatedCode": null,
    "recommendations": [
      {{
        "category": "<implementation|testing|deployment|performance>",
        "severity": "<HIGH|MEDIUM|LOW|INFO>",
        "message": "<implementation note or recommendation>",
        "suggestion": "<detailed guidance>",
        "codeExample": null
      }}
    ],
    "warnings": [],
    "confidence": <float 0.0-1.0>,
    "reasoning": "<brief explanation>"
  }}

  The developer guide (businessExplanation) MUST cover these sections:
  1. GOVERNANCE NOTICE
     AI Generated Developer Guidance | Developer Review Required | Not Production Ready

  2. BUSINESS OVERVIEW
     Purpose of the program, business context, data flow description.

  3. INPUT / OUTPUT FILES
     File names, record layouts, access methods (sequential/VSAM).

  4. FIELD MAPPING SUMMARY
     Table of source field → target field → transformation rule.

  5. TRANSFORMATION SUMMARY
     Description of each transformation applied (date format, string trim, etc.).

  6. VALUE MAPPING SUMMARY
     Table of coded values → descriptions for each lookup field.

  7. COPYBOOK EXPLANATION
     Field-by-field explanation of the copybook record layout with PIC clauses.

  8. COBOL IMPLEMENTATION GUIDANCE
     Key areas developer must complete before compiling:
     - Add actual file names (replace placeholders)
     - Add FILE-STATUS checks
     - Add error handling
     - Add control totals
     - Add audit logging

  9. JCL IMPLEMENTATION GUIDANCE
     Parameters developer must complete:
     - Replace JOBCARD placeholders
     - Add actual dataset names
     - Add SPACE, UNIT, DCB parameters
     - Add restart/checkpoint logic if required

  10. TESTING RECOMMENDATIONS
      Unit test scenarios, boundary conditions, reject record testing.

  11. IMPLEMENTATION NOTES
      Any special considerations, known limitations, and risk areas.

response_schema:
  type: object
  required:
    - businessExplanation
    - confidence
  properties:
    businessExplanation:
      type: string
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
