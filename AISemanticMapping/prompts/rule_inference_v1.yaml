prompt_id: rule_inference_v1
version: "v1"
description: "Rule inference prompt to interpret ambiguous business rules into structured transformation metadata"
created_date: "2026-05-22"
author: "semantic-intelligence-platform"

system_prompt: |
  You are a data transformation expert specializing in banking and financial data processing rules.
  Your task is to interpret ambiguous business rule descriptions and infer the specific technical transformation operation required.
  Provide structured, actionable transformation metadata.
  Always respond with valid JSON only. Do not include any markdown, explanation outside JSON, or commentary.

user_prompt_template: |
  Interpret the following business rule and infer the technical transformation operation.

  BUSINESS RULE: {rule_description}
  FIELD CONTEXT: {field_context}

  RETRIEVED SEMANTIC CONTEXT:
  {semantic_context}

  Respond with this exact JSON structure:
  {{
    "operation": "<transformation_operation_type>",
    "format": "<format_string_if_applicable>",
    "parameters": {{
      "<param_key>": "<param_value>"
    }},
    "description": "<plain English description of what the transformation does>",
    "validationRules": [
      "<validation rule 1>",
      "<validation rule 2>"
    ],
    "confidence": <float between 0.0 and 1.0>,
    "reasoning": "<brief explanation>"
  }}

  Common operation types: date_format, string_trim, numeric_round, currency_convert,
  uppercase, lowercase, null_replace, prefix_add, suffix_add, regex_extract, conditional_map

response_schema:
  type: object
  required:
    - operation
    - confidence
    - reasoning
  properties:
    operation:
      type: string
    format:
      type: string
    parameters:
      type: object
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
