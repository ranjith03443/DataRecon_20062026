prompt_id: rule_inference_v1
version: "v1"
description: "Rule inference prompt to interpret ambiguous business rules into structured transformation metadata"
created_date: "2026-05-22"
author: "semantic-intelligence-platform"

system_prompt: |
  You are a data transformation expert specializing in banking and financial data processing rules.
  Your task is to interpret ambiguous business rule descriptions and infer the specific technical transformation operation required.
  Provide structured, actionable transformation metadata.
  Always respond with valid JSON only. Do not include any markdown, explanation outside JSON, or commentary.

user_prompt_template: |
  Interpret the following business rule and infer the correct transformation operation.

  BUSINESS RULE: {rule_description}
  FIELD CONTEXT: {field_context}

  RETRIEVED SEMANTIC CONTEXT:
  {semantic_context}

  SUPPORTED OPERATIONS — you MUST return the "operation" field as EXACTLY one of these strings.
  No other values are valid. Choose the closest match:
  {supported_operations}

  Parameter hints per operation:
  - DATE_FORMAT       → parameters: inputFormat (e.g. "MM/DD/YYYY"), outputFormat (e.g. "YYYYMMDD")
  - DECIMAL_FORMAT    → parameters: decimalPlaces (int), stripDecimalSeparator ("true"/"false")
  - MASK              → parameters: visibleStart (int), visibleEnd (int), maskChar ("*")
  - PAD_LEFT          → parameters: totalLength (int), padChar (" " or "0")
  - PAD_RIGHT         → parameters: totalLength (int), padChar (" ")
  - TRUNCATE          → parameters: maxLength (int)
  - VALUE_MAPPING     → parameters: map:SOURCE_VALUE = TARGET_VALUE (one entry per code pair)
  - CONCAT            → parameters: fields (comma-separated field names), delimiter (" ")
  - SPLIT             → parameters: delimiter, index (0-based)
  - BOOLEAN_MAPPING   → parameters: trueValues, falseValues, trueOutput, falseOutput
  - CURRENCY_NORMALIZATION → parameters: decimalPlaces (int)
  - DEFAULT_VALUE     → parameters: value (the constant to use)
  - NULL_REPLACEMENT  → parameters: value (the replacement when source is blank)
  - FIXED_WIDTH_FORMAT → parameters: width (int), alignment ("LEFT"/"RIGHT"), padChar
  - STRING_TO_NUMERIC, NUMERIC_TO_STRING, UPPERCASE, LOWERCASE, PROPERCASE, REMOVE_SPECIAL_CHARACTERS → no parameters needed

  Respond with this exact JSON structure:
  {{
    "operation": "<one of the SUPPORTED OPERATIONS listed above>",
    "format": "<format string if applicable, e.g. YYYYMMDD — otherwise omit>",
    "parameters": {{
      "<param_key>": "<param_value>"
    }},
    "description": "<plain English description of what the transformation does>",
    "validationRules": [
      "<validation rule 1>",
      "<validation rule 2>"
    ],
    "confidence": <float between 0.0 and 1.0>,
    "reasoning": "<brief explanation of why this operation was chosen>"
  }}

response_schema:
  type: object
  required:
    - operation
    - confidence
    - reasoning
  properties:
    operation:
      type: string
    format:
      type: string
    parameters:
      type: object
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
