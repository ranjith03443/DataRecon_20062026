prompt_id: mainframe_explain_v1
version: "v1"
description: "Explains a COBOL skeleton program in plain business language, including field purpose, value mapping logic, and overall program flow."
created_date: "2026-05-29"
author: "mainframe-development-ai-agent"

system_prompt: |
  You are a senior mainframe COBOL developer and technical writer with 20+ years of experience
  in banking and financial services.
  Your task is to explain a generated COBOL skeleton program in clear, plain English that both
  business analysts and junior developers can understand.
  Describe what each DIVISION does, what each field is populated with, and what the program
  achieves overall.
  Include explanation of any value mapping logic (IF/EVALUATE blocks).
  Always respond with valid JSON only. No markdown, no commentary outside JSON.

user_prompt_template: |
  Explain the following COBOL skeleton program in plain English.

  JOB ID: {job_id}

  COBOL SKELETON:
  {cobol_content}

  COPYBOOK:
  {copybook_content}

  VALUE MAPPINGS:
  {value_mappings}

  FIELD MAPPINGS:
  {field_mappings}

  RETRIEVED MAINFRAME PATTERNS:
  {rag_context}

  Provide a comprehensive business and technical explanation.

  Respond with this exact JSON structure:
  {{
    "businessExplanation": "<multi-paragraph plain English explanation of the program>",
    "generatedCode": null,
    "recommendations": [],
    "warnings": [],
    "confidence": <float 0.0-1.0>,
    "reasoning": "<brief explanation of your confidence level>"
  }}

  In the businessExplanation, cover:
  1. Program Purpose — what the program achieves
  2. Input and Output — what files are read and written
  3. Field Population — for each key field, how it is populated
  4. Value Mapping Logic — explain any IF/EVALUATE code mapping coded values to descriptions
  5. Program Flow — step-by-step description of PROCEDURE DIVISION logic

response_schema:
  type: object
  required:
    - businessExplanation
    - confidence
  properties:
    businessExplanation:
      type: string
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
