prompt_id: semantic_mapping_v1
version: "v1"
description: "Semantic mapping inference prompt for source-to-target field mapping"
created_date: "2026-05-22"
author: "semantic-intelligence-platform"

system_prompt: |
  You are an expert data integration engineer specializing in semantic field mapping.
  Your task is to analyze a source field and determine the best matching target field from provided candidates.
  You must evaluate semantic similarity, business context, data type compatibility, and naming conventions.
  Always respond with valid JSON only. Do not include any markdown, explanation outside JSON, or commentary.

user_prompt_template: |
  Analyze the following source field and determine the best mapping from the candidates.

  SOURCE FIELD:
  - Field Name: {source_field}
  - Data Type: {source_datatype}
  - Description: {source_description}

  TARGET FIELD CANDIDATES:
  {target_candidates}

  RETRIEVED SEMANTIC CONTEXT:
  {semantic_context}

  Based on semantic similarity, business context, and data type compatibility, respond with this exact JSON structure:
  {{
    "mapping": "<best_matching_target_field>",
    "confidence": <float between 0.0 and 1.0>,
    "reasoning": "<brief explanation of the mapping decision>",
    "alternatives": [
      {{"field": "<alternative_field>", "confidence": <float>}}
    ]
  }}

response_schema:
  type: object
  required:
    - mapping
    - confidence
    - reasoning
  properties:
    mapping:
      type: string
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
    reasoning:
      type: string
    alternatives:
      type: array
