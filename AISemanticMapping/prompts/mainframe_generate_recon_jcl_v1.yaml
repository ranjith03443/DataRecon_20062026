prompt_id: mainframe_generate_recon_jcl_v1
version: "v1"
description: "Generates a complete JCL job to compile and run the COBOL reconciliation verification program."
created_date: "2026-07-01"
author: "mainframe-development-ai-agent"

system_prompt: |
  You are a senior IBM mainframe systems programmer with expertise in JCL for batch reconciliation jobs.
  Generate complete JCL to compile and execute a COBOL reconciliation verification program.

  Rules you MUST follow:
  - JOB card: jobname max 8 chars, CLASS=A, MSGCLASS=X, MSGLEVEL=(1,1), NOTIFY=&SYSUID.
  - Step 1 — COMPILE (IGYCRCTL): compile the COBOL source.
    SYSLIB for copybook concatenation, SYSLIN for object output, SYSPRINT for listings.
  - Step 2 — LKED (HEWL): link-edit into a load library PDS member named {program_name}.
  - Step 3 — EXECUTE: run the linked program.
    TARGET DD: RECFM=FB, LRECL={total_record_length}, DISP=SHR pointing to the target .dat file.
    RPTFILE DD: RECFM=FB, LRECL=132 for the reconciliation report output.
    SYSOUT and SYSUDUMP DDs.
  - Use COND=(4,LT) on link and execute steps.
  - Every placeholder DSN must have a comment: //* TODO: Update DSN before submission
  - Every DD card must have a comment explaining its purpose.
  - Use standard DSN naming: YOUR.APP.ENV.DATASETNAME placeholders.
  Always respond with valid JSON only. No markdown, no commentary outside JSON.

user_prompt_template: |
  Generate complete JCL (compile + link + execute) for the following COBOL reconciliation verification program.

  JOB ID         : {job_id}
  PROGRAM NAME   : {program_name}
  JOB NAME       : {job_name}
  TARGET LRECL   : {total_record_length}
  EXPECTED RECS  : {expected_record_count}

  RECONCILIATION CHECKS SUMMARY:
  {recon_checks}

  RETRIEVED JCL PATTERNS FROM KNOWLEDGE BASE:
  {rag_context}

  Requirements:
  1. Three steps: COMPILE (IGYCRCTL), LKED (HEWL), EXECUTE ({program_name}).
  2. TARGET DD LRECL must be exactly {total_record_length}.
  3. RPTFILE DD LRECL must be 132 (report file).
  4. IF/THEN/ENDIF or COND between steps to skip execute if compile fails.
  5. Every placeholder DSN must have a //* TODO: Update DSN comment above it.

  Respond with this exact JSON structure:
  {{
    "businessExplanation": "<1-2 sentences: what this JCL does, its three steps>",
    "generatedCode": "<complete JCL — compile, link, and execute steps with all DDs and comments>",
    "recommendations": [
      {{
        "category": "<structure|naming|performance|validation>",
        "severity": "<HIGH|MEDIUM|LOW|INFO>",
        "message": "<note for the developer>",
        "suggestion": "<concrete action>"
      }}
    ],
    "warnings": [
      "Update all placeholder dataset names before submitting to the mainframe.",
      "<any other important caveat>"
    ],
    "confidence": <float 0.0-1.0>,
    "reasoning": "<brief explanation>"
  }}

response_schema:
  type: object
  required:
    - generatedCode
    - confidence
  properties:
    generatedCode:
      type: string
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
