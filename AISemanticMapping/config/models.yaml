llm_provider: azure_openai        # overridden by LLM_PROVIDER env var
embedding_provider: azure_openai   # overridden by EMBEDDING_PROVIDER env var

models:
  semantic_mapping:
    model_name: claude-haiku-4-5-20251001
    temperature: 0.1
    max_tokens: 2000
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0
    request_timeout: 60

  schema_enrichment:
    model_name: claude-haiku-4-5-20251001
    temperature: 0.1
    max_tokens: 1000
    top_p: 1.0
    request_timeout: 60

  rule_inference:
    model_name: claude-haiku-4-5-20251001
    temperature: 0.0
    max_tokens: 1000
    top_p: 1.0
    request_timeout: 60

  mainframe_agent:
    provider: azure_openai
    model_name: gpt-4o-mini
    temperature: 0.1
    max_tokens: 8000
    top_p: 1.0
    request_timeout: 300

embedding_models:
  default:
    model_name: text-embedding-3-small
    dimensions: 1536
    batch_size: 100
    request_timeout: 30

providers:
  azure_openai:
    api_version: "2024-02-15-preview"
    # endpoint and key come from environment variables

  openai:
    # key comes from environment variables
    base_url: "https://api.openai.com/v1"

  ollama:
    base_url: "http://localhost:11434"
    default_model: "llama3"

  huggingface:
    base_url: "https://api-inference.huggingface.co"
    # token comes from environment variables

  claude:
    base_url: "https://api.anthropic.com/v1/messages"
    default_model: "claude-haiku-4-5-20251001"
    # ANTHROPIC_API_KEY comes from environment variables

claude_models:
  semantic_mapping:
    model_name: claude-haiku-4-5-20251001
    temperature: 0.1
    max_tokens: 2000
    request_timeout: 60

  schema_enrichment:
    model_name: claude-haiku-4-5-20251001
    temperature: 0.1
    max_tokens: 1000
    request_timeout: 60

  rule_inference:
    model_name: claude-haiku-4-5-20251001
    temperature: 0.0
    max_tokens: 1000
    request_timeout: 60

  mainframe_agent:
    provider: claude
    model_name: claude-sonnet-4-6
    temperature: 0.1
    max_tokens: 16000
    request_timeout: 300
